name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      # vs2022, not the vs2026 premake5.bat uses: the runners ship VS 2022.
      - run: .\premake5.exe vs2022

      # The project, not the solution, so the generated file's extension does not matter.
      - run: msbuild build\XIIIMongooseFix.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # The release layout, as release.bat builds it.
      - run: copy bin\XIIIMongooseFix.asi data\bin\plugins\

      - uses: actions/upload-artifact@v4
        with:
          name: XIIIMongooseFix
          path: data
