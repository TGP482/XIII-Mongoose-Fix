[Display]
DisplayMode = 1                 // (0) Windowed, (1) Borderless, (2) Fullscreen.
ResolutionX = 0                 // Window and back buffer width. 0 uses your desktop resolution.
ResolutionY = 0                 // Window and back buffer height. 0 uses your desktop resolution.
InternalResolutionX = 0         // Sets the internal game ResX without it affecting the window resolution, useful for supersampling and downscaling. Range: 320 - 16384.
InternalResolutionY = 0         // Sets the internal game ResY without it affecting the window resolution, useful for supersampling and downscaling. Range: 240 - 16384.
ScalingFilter = 1               // How the internal frame is scaled to the output, (0) point, (1) bilinear.
VSync = 1                       // (0) off, (1) on.
MaxFrameRate = 1                // Caps the game's frame rate. (0) unlocked, (1) your monitor's refresh rate.

[Graphics]
AnisotropicFiltering = 16       // Forces the selected AF level on all textures. 0 uses the game's defaults.
MSAA = 0                        // Multisample antialiasing on the back buffer. (0) off, 2, 4 or 8 samples. Drops to the highest level your card supports and cannot be combined with an internal resolution.

[Gameplay]
MouseLookSensitivity = 1.0      // Ajusts mouse look speed, 1.0 is stock. Range: 0.01 - 20.0.
MouseSmoothing = 0              // Toggles mouse smoothing, (0) off, (1) on.

[FieldOfView]
FieldOfView = 91.31             // Changes the horizontal FOV, stock is 85. Range: 45 - 145. Weapon zoom and scopes keep their magnification.

[Controller]
ControllerLookSensitivity = 1.0 // Gamepad look speed, on top of the in-game slider. 1.0 is stock. R:ange 0.01 - 20.0.
Vibration = 1                   // Restores controller vibration.
Layout = 0                      // Controller layout: (0) Classic Halo, (1) Goofy Halo, (2) Classic XIII, (3) Goofy XIII. The in-game controls menu changes it from there.

[General]
SkipIntro = 1                   // Skips the Ubisoft, alien and nvidia logo FMVs.
AllowCheats = 1                 // Allows cheats to be used through the console.
