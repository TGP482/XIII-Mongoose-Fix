[Display]
ResolutionX = 0                 // Window and back buffer width. 0 uses your desktop resolution.
ResolutionY = 0                 // Window and back buffer height. 0 uses your desktop resolution.
VSync = 1                       // Waits for the display before presenting. Works windowed as well as fullscreen, which the game itself does not.
MaxFrameRate = 0                // Frame rate cap. (0) unlocked

[Graphics]
AnisotropicFiltering = 16       // Forces the chosen level of anisotropic filtering

[Input]
MouseSensitivity = 1.0          // Multiplier on top of the game's own sensitivity. 1.0 matches stock, range 0.01 to 10.0.
MouseSmoothing = 0              // The game's mouse filter. It averages frames together, keeps moving the view after you stop, and clamps fast movement. (0) off, (1) stock.

[FieldOfView]
FieldOfView = 91.31             // Horizontal field of view in degrees. Stock is 85, range 45 to 145. Weapon zoom and scopes keep their magnification.

[Interface]
ComicPanelScaling = 1           
ComicPanelScale = 0             
