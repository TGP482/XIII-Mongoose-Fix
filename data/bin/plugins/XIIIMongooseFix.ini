[Display]
DisplayMode = 1                 // (0) windowed, (1) borderless, (2) fullscreen. 
ResolutionX = 0                 // Window and back buffer width. 0 uses your desktop resolution.
ResolutionY = 0                 // Window and back buffer height. 0 uses your desktop resolution.
InternalResolutionX = 0         // Sets the internal game ResX without it affecting the window resolution, useful for supersampling and downscaling. Range: 320 - 16384
InternalResolutionY = 0         // Sets the internal game ResY without it affecting the window resolution, useful for supersampling and downscaling. Range: 240 - 16384
ScalingFilter = 1               // Internal resolution scaling filter: (0) point, (1) bilinear.
VSync = 1                       // Applied V-sync. (0) off, (1) on.
MaxFrameRate = 1                // Frame rate cap. (0) unlocked, (1) your monitor's refresh rate.


[Graphics]
AnisotropicFiltering = 16       // Forces the chosen level of anisotropic filtering
MSAA = 0                        // Multisample anti-aliasing on the back buffer. (0) off, 2, 4 or 8 samples. Drops to the highest level your card supports. Turns off windowed VSync, and cannot be combined with an internal resolution.

[Input]
MouseSensitivity = 1.0          // Multiplier on the view's mouse speed. Range 0.01 to 20.0.
MouseSmoothing = 0              // The game's mouse filter. It averages frames together, keeps moving the view after you stop, and clamps fast movement. (0) off, (1) stock.

[FieldOfView]
FieldOfView = 91.31             // Horizontal field of view in degrees. Stock is 85, range 45 to 145. Weapon zoom and scopes keep their magnification.

[Interface]
SkipIntroMovies = 1             // Skips the ubi, alien and nvidia logo movies at startup. (0) off, (1) skip.
